<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listado de Pacientes - Gestor de Turnos</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard_style.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <!-- ENCABEZADO -->
      <header class="main-header">
        <span>Gestor de turnos</span>
        <div class="header-actions">
          <button id="btn-toggle-menu" class="btn-menu">&#9776;</button>
          <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
        </div>
      </header>

      <!-- NAVEGACIÓN (Panel Lateral) -->
      <nav id="sidebar" class="sidebar">
        <ul class="nav-links">
          <li><a href="#">Panel Principal</a></li>
          <li><a href="#">Pacientes</a></li>
        </ul>
      </nav>

      <!-- CONTENIDO PRINCIPAL -->
      <main class="main-content">
        <!-- Sección del título -->
        <section class="page-header">
          <h1>Directorio de Pacientes</h1>
        </section>

        <!-- Sección de la tabla -->
        <section class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Paciente</th>
              </tr>
            </thead>
            <tbody id="paciente-table-body">
              <!-- Los pacientes se cargarán aquí dinámicamente -->
            </tbody>
          </table>
        </section>
      </main>

      <!-- PIE DE PÁGINA -->
      <footer class="main-footer">
        Gestor de Turnos &copy; 2026 - Proyecto Académico
      </footer>
    </div>

    <!-- El JS se carga al final para asegurar que el HTML ya esté dibujado -->
    <script src="js/dashboard.js"></script>
  </body>
</html>
